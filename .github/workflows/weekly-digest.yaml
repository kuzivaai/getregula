name: Weekly Triage Digest

on:
  schedule:
    - cron: "0 9 * * 1"  # Every Monday 09:00 UTC
  workflow_dispatch:       # Allow manual trigger for testing

permissions:
  contents: read
  issues: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for open issues
        id: issue_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          COUNT=$(gh issue list --repo "$REPO" --state open --limit 1 --json number | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Generate triage digest
        if: steps.issue_check.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REGULA_DIGEST_MODEL: claude-sonnet-4-6
          REPO: ${{ github.repository }}
        run: |
          gh issue list --repo "$REPO" --state open --limit 100 \
            --json number,title,labels,createdAt,body \
            > "$RUNNER_TEMP/regula-issues.json"
          python3 scripts/weekly_digest.py \
            --issues "$RUNNER_TEMP/regula-issues.json" \
            --output "$RUNNER_TEMP/TRIAGE_DRAFT.md"

      - name: Publish human-review draft to job summary
        if: steps.issue_check.outputs.count != '0'
        run: |
          echo "## Model-assisted triage draft, human review required" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/TRIAGE_DRAFT.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip message when no issues
        if: steps.issue_check.outputs.count == '0'
        run: echo "No open issues, skipping digest this week"
