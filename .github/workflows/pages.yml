name: Deploy to GitHub Pages

# This is the repository's only Pages deployer. Two concurrent deployers raced
# on 6 August 2026, after which this workflow became manual-only and ci.yaml
# remained the automatic writer. Commit 59fa3146 then removed the ci.yaml job
# while Pages was deliberately unpublished, leaving no automatic deployer.
#
# Automatic deployments now start only after the complete CI workflow succeeds
# for a push to main. The manual path is restricted to main by the build-job
# condition and the github-pages environment branch policy. Both paths upload
# the exact commit that passed the gate, then use the same pages concurrency
# group with non-cancelling semantics.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build verified Pages artifact
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the verified main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify checkout identity
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy verified artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          # A 20-minute poll budget is retained from the measured 6 August
          # recovery. GitHub completed one deployment 82 seconds after the
          # action's 10-minute default had reported a false failure.
          timeout: 1200000
