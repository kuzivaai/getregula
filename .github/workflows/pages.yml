name: Deploy to GitHub Pages

# MANUAL ONLY since 2026-08-06. This workflow used to trigger on push to main
# for `site/**`, and ci.yaml carries its OWN `deploy` job doing the same thing
# on every push to main. Both create a GitHub Pages deployment for the same
# commit, and both take the `pages` concurrency group with CONTRADICTORY
# semantics: this file said `cancel-in-progress: false`, ci.yaml's job says
# `true`.
#
# MEASURED 2026-08-06: on the push of b978076 the two runs started one second
# apart (13:10:08 and 13:10:09) and raced. Every Pages deployment afterwards
# failed, first with `Timeout reached` while stuck in `deployment_queued` and
# then with `Deployment request failed ... due to in progress deployment.
# Please cancel b978076... first`, for six attempts across two commits. The
# cancel endpoint returned 204 and the deployment reported
# `deployment_cancelled` while the create path still refused, which is the
# shape of a backend left inconsistent by two writers.
#
# One automatic deployer only. ci.yaml's job is kept as the automatic one
# because it is gated on `needs: test`, so a red suite cannot publish; this
# workflow had no such gate. Retained here as workflow_dispatch so a manual
# redeploy is still possible without re-adding the race.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          # Same 1200000ms poll budget as ci.yaml's deploy job, and the same
          # reason: measured on 2026-08-06 a deployment completed 82 seconds
          # after the 600000ms default gave up. See the note in ci.yaml.
          timeout: 1200000
