name: Weekly Metrics & Regulatory Monitor

on:
  schedule:
    - cron: "0 10 * * 1"  # Every Monday 10:00 UTC (after triage digest)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Collect PyPI download stats
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request
          from collections import defaultdict
          from datetime import date, timedelta
          from pathlib import Path

          today = date.today()
          metrics_dir = Path("data/metrics")
          metrics_dir.mkdir(parents=True, exist_ok=True)

          # Fetch the DATED DAILY series and compute the window here.
          #
          # Do not use an aggregate endpoint or the pypistats CLI's summary
          # output for a windowed figure. Those return a total over whatever
          # period the service happens to serve (~180 days), with no window in
          # the payload. Writing such a total under a hard-coded
          # "period": "last_7_days" is what produced the defect corrected on
          # 2026-08-14: every row from 2026-04-20 to 2026-08-10 recorded a
          # whole-period cumulative total labelled as a weekly one, overstating
          # weekly downloads by ~35x (with mirrors) and ~88x (without).
          # See docs/improvement/LEDGER.md N109.
          #
          # The window below is derived from the data's own date fields and the
          # boundaries are written into the artefact so any reader can re-derive
          # the figure. Never reintroduce a period label that is a constant.
          def fetch(path):
              url = f"https://pypistats.org/api/packages/regula-ai/{path}"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "regula-metrics"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read().decode())
              except Exception:
                  return None

          WINDOW_DAYS = 7

          def last_complete_day(payload):
              """pypistats publishes complete days only, so anchor the window on
              the data's own latest date rather than on today's date."""
              if not payload or not payload.get("data"):
                  return None
              dates = sorted({r["date"] for r in payload["data"] if r.get("date")})
              return date.fromisoformat(dates[-1]) if dates else None

          def window_sum(payload, start, end):
              """Sum downloads per category over [start, end], plus all-time.

              Every series is summed over the SAME window, passed in explicitly,
              so by_system and by_python describe the same week as downloads.
              A category may legitimately be absent: pypistats reports "null"
              for counts it does not break out, and those are not attributed.
              """
              win, allt = defaultdict(int), defaultdict(int)
              if not payload or not payload.get("data"):
                  return {}, {}
              for r in payload["data"]:
                  cat = r.get("category")
                  if cat in (None, "null"):
                      continue
                  allt[cat] += r["downloads"]
                  if r.get("date") and start <= date.fromisoformat(r["date"]) <= end:
                      win[cat] += r["downloads"]
              return dict(win), dict(allt)

          # No mirrors= param: the bare endpoint returns BOTH the with_mirrors
          # and without_mirrors categories. Passing mirrors=true filters to one.
          overall = fetch("overall")
          by_system = fetch("system")
          by_python = fetch("python_minor")

          win_end = last_complete_day(overall)
          win_start = win_end - timedelta(days=WINDOW_DAYS - 1) if win_end else None

          if win_end:
              dl, dl_all = window_sum(overall, win_start, win_end)
              sys_win, _ = window_sum(by_system, win_start, win_end)
              py_win, _ = window_sum(by_python, win_start, win_end)
          else:
              dl, dl_all, sys_win, py_win = {}, {}, {}, {}

          snapshot = {
              "date": today.isoformat(),
              "period": f"last_{WINDOW_DAYS}_complete_days",
              "window_start": win_start.isoformat() if win_start else None,
              "window_end": win_end.isoformat() if win_end else None,
              "downloads": dl,
              "all_time_to_date": dl_all,
              "by_system": sys_win,
              "by_python": py_win,
          }

          if win_end is None:
              snapshot["collection_error"] = "pypistats unavailable; no window derived"

          # Append to rolling log
          log_file = metrics_dir / "pypi_weekly.json"
          history = json.loads(log_file.read_text()) if log_file.exists() else []
          history.append(snapshot)
          # Keep last 52 weeks
          history = history[-52:]
          log_file.write_text(json.dumps(history, indent=2) + "\n")

          print(f"Snapshot: {json.dumps(snapshot, indent=2)}")
          PYEOF

      - name: Collect GitHub traffic stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, subprocess, sys
          from datetime import date
          from pathlib import Path

          metrics_dir = Path("data/metrics")
          metrics_dir.mkdir(parents=True, exist_ok=True)

          def gh_api(endpoint):
              r = subprocess.run(
                  ["gh", "api", endpoint],
                  capture_output=True, text=True, timeout=30,
              )
              return json.loads(r.stdout) if r.returncode == 0 else None

          views = gh_api("repos/{owner}/{repo}/traffic/views")
          clones = gh_api("repos/{owner}/{repo}/traffic/clones")
          repo = gh_api("repos/{owner}/{repo}")

          snapshot = {
              "date": date.today().isoformat(),
              "stars": repo.get("stargazers_count", 0) if repo else 0,
              "forks": repo.get("forks_count", 0) if repo else 0,
              "watchers": repo.get("subscribers_count", 0) if repo else 0,
              "open_issues": repo.get("open_issues_count", 0) if repo else 0,
              "views_14d": views.get("count", 0) if views else 0,
              "unique_visitors_14d": views.get("uniques", 0) if views else 0,
              "clones_14d": clones.get("count", 0) if clones else 0,
              "unique_cloners_14d": clones.get("uniques", 0) if clones else 0,
          }

          log_file = metrics_dir / "github_weekly.json"
          history = json.loads(log_file.read_text()) if log_file.exists() else []
          history.append(snapshot)
          history = history[-52:]
          log_file.write_text(json.dumps(history, indent=2) + "\n")

          print(f"GitHub: {json.dumps(snapshot, indent=2)}")
          PYEOF

      - name: Check EUR-Lex for AI Act updates
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, sys
          from datetime import date, timedelta
          from pathlib import Path

          # EUR-Lex SPARQL endpoint for the AI Act (CELEX 32024R1689)
          # Check for any documents referencing/amending the AI Act in the last 14 days
          today = date.today()
          two_weeks_ago = (today - timedelta(days=14)).isoformat()

          # EUR-Lex REST search for recent AI Act-related documents
          search_url = (
              "https://eur-lex.europa.eu/search.html?"
              "scope=EURLEX&text=%22artificial+intelligence+act%22"
              f"&DTS_SUBDOM=LEGISLATION&type=advanced&"
              f"DD_FREE_DATE_FROM={two_weeks_ago}&DD_FREE_DATE_TO={today.isoformat()}"
              "&page=1&sortOne=DD_FREE_DATE&sortOneOrder=desc"
          )

          # Also check the EU AI Office page for news
          ai_office_url = "https://digital-strategy.ec.europa.eu/en/policies/regulatory-framework-ai"

          alerts_file = Path("data/metrics/regulatory_alerts.json")
          alerts = json.loads(alerts_file.read_text()) if alerts_file.exists() else []

          alert = {
              "date": today.isoformat(),
              "check": "weekly-automated",
              "eurlex_search_url": search_url,
              "ai_office_url": ai_office_url,
              "note": "Automated weekly check. Manual review required for new entries.",
              "action_needed": False,
          }

          # EUR-Lex does not offer a stable public REST/JSON API.
          # The v2/search endpoint (used previously) returned 404 for 9 consecutive
          # weeks. EUR-Lex requires JS rendering for search results; HEAD requests
          # return 202. Instead, we check the AI Act Official Journal page and the
          # EU AI Office page are reachable, and log the manual-review URLs.
          check_urls = [
              ("eurlex_ai_act", "https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R1689"),
              ("ai_office", ai_office_url),
          ]
          for label, url in check_urls:
              try:
                  req = urllib.request.Request(url, method="HEAD",
                      headers={"User-Agent": "regula-monitor/1.0"})
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      alert[f"{label}_status"] = resp.status
              except Exception as e:
                  alert[f"{label}_error"] = str(e)

          alert["note"] = (
              "Automated reachability check only. EUR-Lex has no public JSON API. "
              "Review the search URL manually for new AI Act documents: "
              f"{search_url}"
          )

          alerts.append(alert)
          alerts = alerts[-52:]
          alerts_file.write_text(json.dumps(alerts, indent=2) + "\n")

          print(f"Regulatory check: {json.dumps(alert, indent=2)}")
          PYEOF

      - name: Commit metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/metrics/
          git diff --cached --quiet || git commit -m "chore: weekly metrics $(date +%Y-%m-%d) [skip ci]"
          git push
