# Site integrity guard — regen drift, source invariants, links and claims.
# Runs read-only; no deploy steps.
name: Site Integrity

on:
  pull_request:
    paths:
      - "site/**"
      - "content/regulations/**"
      - "scripts/build_regulations.py"
      - "scripts/site_integrity.py"
      - "scripts/claim_auditor.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Site integrity (regen drift, sources, links, claims)
        run: python3 scripts/site_integrity.py
