# Regula is stdlib-only at runtime, so the surface area for Dependabot
# is small by design. What it does watch:
#
#   - pyproject.toml optional and contributor-test dependencies
#   - GitHub Actions versions used in .github/workflows/
#
# The runtime package installs with zero production dependencies per
# CLAUDE.md ("Zero production dependencies") and SECURITY.md. If a PR
# ever introduces a runtime dependency, that is a deliberate policy
# change and should be flagged explicitly.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "dev-deps"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5
    # Deliver all action bumps in ONE PR. Ungrouped, codeql-action's
    # init and analyze arrived as separate PRs (#25/#28) that could
    # never pass individually: each created a v3/v4 major mix that
    # fails with a config version mismatch. Grouping closes the class.
    groups:
      github-actions:
        patterns:
          - "*"
