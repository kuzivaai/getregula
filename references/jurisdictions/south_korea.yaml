jurisdiction_id: south_korea
name: South Korea AI Basic Act
law_reference: "Act on Development of AI and Establishment of Trust (Act No. 20738)"
effective_date: "2026-01-22"
status: "In force (grace period through 2026)"

penalties:
  max_fine: "KRW 30 million (~USD 20,700)"
  criminal: "Up to 3 years imprisonment"
  range: "Up to KRW 30M fine or 3 years imprisonment"
  grace_period: "MSIT deferring enforcement through 2026 except for serious harm"

deadlines:
  default: "2026-01-22"
  grace_period_end: "2027-01-01"

risk_tiers:
  - high_impact
  - high_performance
  - general

domain_mappings:
  biometrics:
    risk_level: high_impact
    articles: ["33", "34"]
    category: "Criminal investigations using biometric data"
    obligations:
      - {article: "34", name: "Risk management plan"}
      - {article: "34", name: "Documentation and recordkeeping"}
      - {article: "34", name: "Human oversight"}
      - {article: "34", name: "Explainability of AI decisions"}
      - {article: "31", name: "Transparency notification"}
  employment:
    risk_level: high_impact
    articles: ["33", "34"]
    category: "Employment decisions (hiring, recruitment)"
    obligations:
