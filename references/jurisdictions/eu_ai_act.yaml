jurisdiction_id: eu_ai_act
name: EU AI Act
law_reference: "Regulation (EU) 2024/1689"
effective_date: "2024-08-01"
status: "In force (phased enforcement)"

penalties:
  prohibited: "EUR 35 million or 7% global turnover"
  high_risk: "EUR 15 million or 3% global turnover"
  range: "Up to EUR 35 million or 7% global turnover"

deadlines:
  prohibited: "2025-02-02"
  transparency: "2026-08-02"
  high_risk_annex_iii: "2027-12-02"
  high_risk_annex_i: "2028-08-02"
  default: "2027-12-02"
  omnibus_note: "Annex III deadline deferred by the Omnibus (Regulation (EU) 2026/1744, OJ 24 Jul 2026, in force since 27 Jul 2026)"

risk_tiers:
  - prohibited
  - high_risk
  - high_risk_exempt
  - limited_risk
  - minimal_risk

